yaml
name: Render and publish Quarto website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          # Match the R version shown at the top of your renv.lock file
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore R packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Check rmarkdown
        run: |
          Rscript -e 'stopifnot(requireNamespace("rmarkdown", quietly = TRUE)); print(packageVersion("rmarkdown"))'

      - name: Render website
        run: quarto render

      - name: Commit rendered website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs/

          if git diff --cached --quiet; then
            echo "No rendered changes."
          else
            git commit -m "Automatically update website"
            git push origin HEAD:main
          fi
