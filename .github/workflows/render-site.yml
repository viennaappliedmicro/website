name: Deploy Quarto website to GitHub Pages

on:
  schedule:
    - cron: '17 4 * * *'

  workflow_dispatch:

  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  # Build the Quarto website
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("lubridate", "leaflet", "rmarkdown"), repos = "https://cloud.r-project.org")'

      - name: Clean previous output
        run: rm -rf docs

      - name: Render website
        run: quarto render

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  # Publish the website
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
