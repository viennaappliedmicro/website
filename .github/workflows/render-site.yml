name: Render and publish Quarto website

on:
  schedule:
    - cron: "25 18 * * *"

  # Allow manual runs from the GitHub Actions tab.
  workflow_dispatch:

  # Also rebuild when you push changes to the website source.
  # Changes made only to docs/ do not trigger another workflow run.
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"

# Allows the workflow to commit the newly rendered docs/ files to the repo.
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      # Download the repository contents.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      # Install R and Quarto
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Install R packages
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("leaflet", "lubridate"), repos = "https://cloud.r-project.org")'

      # Render the Quarto website.
      - name: Render website
        run: quarto render

      # Commit updated rendered files only if rendering produced a change.
      - name: Commit and push website changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/

          if git diff --cached --quiet; then
            echo "No changes to the rendered website."
          else
            git commit -m "Automatically update website"
            git push
          fi
